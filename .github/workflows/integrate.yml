name: Python Backend

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]


jobs:
  build-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Env
        run: |
          python --version
          echo "python working!"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npx jest --ci

      - name: Run frontend preprocessing equivalence tests
        working-directory: frontend
        run: npm run test:pyodide

      - name: Run unit tests
        run: |
          cd ml
          python -m pytest . --ignore=test/local

      - name: Build & boot server stack
        run: docker compose -f backend/docker-compose.yml up --build -d

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "server responding (HTTP $code)"; exit 0
            fi
            echo "waiting for server... ($i)"; sleep 2
          done
          echo "server did not become ready"
          docker compose -f backend/docker-compose.yml logs
          exit 1

      - name: Run e2e network tests
        run: |
          cd backend
          python -m pytest test/network/

      - name: Tear down server stack
        if: always()
        run: docker compose -f backend/docker-compose.yml down


  ai-review:
    needs: build-and-test # only runs if build-and-test is successful
    if: |
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' || github.event_name == 'issue_comment')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
    - name: PR Agent
      uses: The-PR-Agent/pr-agent@v0.36.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        config.model: "gemini/gemini-3.5-flash"
        config.fallback_models: '["gemini/gemini-3.1-flash-lite-preview"]'
        GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        github_action_config.auto_review: "true"
        github_action_config.auto_describe: "false"
        github_action_config.auto_improve: "false"
        github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
