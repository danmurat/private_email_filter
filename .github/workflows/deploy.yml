name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Commit SHA to roll back to (leave blank for a normal redeploy of latest)"
        required: false
        default: ""

# Never let two deploys overlap on the same box
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ── Normal deploy path ────────────────────────────────────────────────────
  # Runs on every push to main, and on manual runs where no rollback_sha is given.
  build-and-push:
    name: Build & push image
    if: ${{ github.event.inputs.rollback_sha == '' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64          # t3.micro is x86_64
          push: true
          tags: |
            danmurat/priv-mail-server:latest
            danmurat/priv-mail-server:${{ github.sha }}

  # ── Rollback path ─────────────────────────────────────────────────────────
  # Runs only on a manual workflow_dispatch that supplies a rollback_sha.
  # Re-points :latest at the chosen historical image on Docker Hub.
  rollback-retag:
    name: Rollback — retag old SHA as latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_sha != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag old image as latest
        run: |
          docker pull danmurat/priv-mail-server:${{ github.event.inputs.rollback_sha }}
          docker tag  danmurat/priv-mail-server:${{ github.event.inputs.rollback_sha }} \
                      danmurat/priv-mail-server:latest
          docker push danmurat/priv-mail-server:latest

  # ── Deploy to EC2 ─────────────────────────────────────────────────────────
  # Runs after whichever of the two paths above succeeded.
  # Skipped if an upstream job failed or was cancelled.
  deploy:
    name: Deploy to EC2
    needs: [build-and-push, rollback-retag]
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH into instance and update container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user            # Amazon Linux default user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /app
            # Pull only the web service image (leaves nginx:alpine untouched).
            # sudo is required because ec2-user is not in the docker group.
            sudo docker compose pull web
            sudo docker compose up -d
            sudo docker image prune -f   # reclaim disk on the 1 GB VM
